name: 'Nightly Evaluations'

on:
  schedule:
    - cron: '0 1 * * *' # 1 AM UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of iterations per test case'
        required: true
        default: '1'

jobs:
  evaluate:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    strategy:
      matrix:
        model:
          [
            'gemini-3-pro-preview',
            'gemini-3-flash-preview',
            'gemini-2.5-pro',
            'gemini-2.5-flash',
            'gemini-2.5-flash-lite',
          ]
    name: 'Evaluate ${{ matrix.model }}'

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5' # v4

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 'Install dependencies'
        run: |
          npm ci

      - name: 'Install Gemini CLI'
        run: 'npm install -g @google/gemini-cli@latest'

      - name: 'Run Evaluations'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GEMINI_MODEL: '${{ matrix.model }}'
        run: |
          npm run test:evals -- --reporter=json --outputFile=eval-results-${GEMINI_MODEL}.json

      - name: 'Upload Results'
        if: 'always()'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # v4
        with:
          name: 'eval-results-${{ matrix.model }}'
          path: 'eval-results-${{ matrix.model }}.json'

      - name: 'Job Summary'
        if: 'always()'
        env:
          GEMINI_MODEL: '${{ matrix.model }}'
        run: |
          npx tsx scripts/aggregate_evals.ts "eval-results-${GEMINI_MODEL}.json" >> "$GITHUB_STEP_SUMMARY"
