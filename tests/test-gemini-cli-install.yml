name: Test Gemini CLI installation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action installs the Gemini CLI from npm.
      # The action will fail at gemini_run (fake API key), but we can verify
      # the CLI was installed by checking if 'gemini' is in PATH afterward.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-key-for-install-test'
          gemini_cli_version: 'latest'

      - name: Assert Gemini CLI was installed
        run: |
          echo "Checking if gemini CLI is installed..."
          if command -v gemini > /dev/null 2>&1; then
            echo "gemini found at: $(which gemini)"
            gemini --version || echo "(version command returned non-zero, but binary exists)"
            echo "PASS: Gemini CLI was installed successfully"
          else
            echo "FAIL: gemini CLI not found in PATH after action ran"
            exit 1
          fi

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at gemini_run (fake API key) or succeed.
          # Either way, the install step must have succeeded.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (install step succeeded)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
