name: Test validation warning with multiple auth methods
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When multiple auth methods are provided, the action should emit a warning
      # but NOT fail at the validation step. It will fail later at the run step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          google_api_key: 'fake-google-api-key'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action failed at run step (not at validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail (at the gemini run step, not at validation)
          # Validation only emits warnings for multiple auth methods
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected (validation warned, run step failed)"

      - name: Verify validation logic for multiple auth methods
        run: |
          # Simulate the validation logic to verify it counts auth methods correctly
          INPUT_GEMINI_API_KEY_PRESENT="true"
          INPUT_GOOGLE_API_KEY_PRESENT="true"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT="false"

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          echo "auth_methods: $auth_methods"
          if [ "$auth_methods" -ne 2 ]; then
            echo "FAIL: expected 2 auth methods, got $auth_methods"
            exit 1
          fi
          echo "PASS: validation correctly counted $auth_methods auth methods (would warn)"
