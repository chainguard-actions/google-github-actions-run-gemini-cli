name: Test Workload Identity Federation auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          gcp_service_account: my-service-account@my-fake-project.iam.gserviceaccount.com
          gcp_project_id: my-fake-project-id
          gcp_location: us-central1
          use_vertex_ai: 'true'
          extensions: '[]'
          prompt: 'Say hello in one word.'
          gemini_cli_version: 'latest'
          workflow_name: 'test-wif-auth'

      - name: Assert action ran (validate_inputs step always runs)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the Authenticate to Google Cloud step
          # with fake WIF credentials, but validate_inputs always runs first
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
