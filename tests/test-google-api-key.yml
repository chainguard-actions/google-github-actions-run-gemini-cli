name: Test google_api_key input with Vertex AI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: 'fake-vertex-api-key-for-input-coverage'
          use_vertex_ai: 'true'
          prompt: 'Say hello'

      - name: Assert action ran with google_api_key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          echo "error: $ERROR"
          # The action may fail because the API key is fake, but it should
          # have accepted the google_api_key input and attempted to run
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key), inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
