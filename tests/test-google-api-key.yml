name: Test google_api_key with vertex AI inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: 'fake-vertex-api-key-for-testing'
          use_vertex_ai: 'true'
          gcp_location: 'us-central1'
          prompt: 'Say hello'

      - name: Assert action ran (validation step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the gemini run step due to invalid API key
          # but it should not fail at the validation step
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran as expected (outcome: ${{ steps.action.outcome }})"
