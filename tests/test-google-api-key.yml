name: Test google_api_key input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with google_api_key input
        id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: 'fake-google-api-key-for-coverage'
          use_vertex_ai: 'true'
          prompt: 'Hello'

      - name: Assert action was attempted with google_api_key input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail at the gemini_run step due to fake API key,
          # but the google_api_key input is exercised. We verify the step ran.
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action step did not run"
            exit 1
          fi
          echo "PASS: action step ran with google_api_key input (outcome: ${{ steps.action.outcome }})"
