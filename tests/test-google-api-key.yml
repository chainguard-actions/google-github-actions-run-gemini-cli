name: Test google_api_key input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: 'fake-google-api-key-for-input-coverage'
          use_vertex_ai: 'true'
          prompt: 'Say hello'

      - name: Assert action ran (fails gracefully with fake google_api_key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake google_api_key"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real API key available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
