name: Test google_api_key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: 'fake-vertex-key-for-coverage'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
      - name: Assert action ran (google_api_key input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          echo "error: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Vertex AI key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
