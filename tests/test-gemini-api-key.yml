name: Test gemini_api_key with model and debug inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          gemini_model: 'gemini-2.0-flash'
          gemini_debug: 'false'
          settings: '{"theme": "default"}'
          prompt: 'Say hello'

      - name: Assert action ran (validation step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the gemini run step due to invalid API key
          # but it should not fail at the validation step
          # We just verify the step ran (outcome is either success or failure, not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran as expected (outcome: ${{ steps.action.outcome }})"
