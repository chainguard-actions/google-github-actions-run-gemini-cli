name: Test input validation warns when no auth method provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake npm and gemini CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Create the fake gemini binary
          cat > /tmp/fake-gemini << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "1.0.0-fake"
            exit 0
          fi
          printf '{"response": "Response without auth"}'
          exit 0
          EOF
          chmod +x /tmp/fake-gemini

          REAL_NPM="$(which npm)"
          cat > "$HOME/.local/bin/npm" << NPMEOF
          #!/bin/sh
          case "\$*" in
            *@google/gemini-cli*)
              echo "Intercepted gemini-cli install, installing fake binary"
              cp /tmp/fake-gemini /usr/local/bin/gemini
              chmod +x /usr/local/bin/gemini
              exit 0
              ;;
            *)
              exec "${REAL_NPM}" "\$@"
              ;;
          esac
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run action with no auth method (should warn but not fail)
        id: action
        uses: .
        with:
          prompt: 'Hello world'
          # No gemini_api_key, google_api_key, or gcp_workload_identity_provider

      - name: Assert action completed despite no auth method
        run: |
          echo "PASS: action completed without failing despite no auth method"
          echo "The validate_inputs step emits warnings but does not exit with error"

      - name: Assert summary output is set
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is set"
