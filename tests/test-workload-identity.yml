name: Test Workload Identity Federation Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with WIF inputs (validation only)
        id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          gcp_service_account: 'my-service-account@my-project.iam.gserviceaccount.com'
          gcp_project_id: 'my-test-project'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
      - name: Assert action started (WIF auth will fail without real credentials)
        run: |
          echo "Action completed (WIF auth step will fail without real credentials, which is expected)"
          echo "PASS: inputs were accepted by the action"
