name: Test Workload Identity Federation Auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with workload identity federation inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          gcp_project_id: 'fake-project-id'
          gcp_service_account: 'fake-sa@fake-project-id.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          extensions: '["@google/gemini-cli-extension-example"]'
          prompt: 'Say hello'

      - name: Assert action ran (expected to fail at auth step without real credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: inputs were accepted and action attempted to run"
