name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          gcp_project_id: 'my-fake-project-id'
          gcp_service_account: 'my-service-account@my-fake-project-id.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          extensions: '[]'
          prompt: 'Say hello'

      - name: Assert action ran (validation step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the GCP auth step due to fake credentials
          # but it should not fail at the validation step
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran as expected (outcome: ${{ steps.action.outcome }})"
