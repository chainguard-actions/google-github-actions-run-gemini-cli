name: Test input validation - multiple auth methods
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action warns (but does not fail) when multiple auth
      # methods are provided simultaneously.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-gemini-key'
          google_api_key: 'fake-google-key'
          use_vertex_ai: 'true'
          # Both gemini_api_key and google_api_key provided — should warn

      - name: Assert action progressed past validate_inputs step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The validate_inputs step should emit a warning but NOT fail.
          # The action will eventually fail at gemini_run (fake keys).
          # We accept both 'failure' and 'success' as valid outcomes here.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: validate_inputs step did not hard-fail on multiple auth methods"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Verify multiple-auth validation logic independently
        run: |
          # Simulate the validation logic from the action
          INPUT_GEMINI_API_KEY_PRESENT="true"
          INPUT_GOOGLE_API_KEY_PRESENT="true"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT="false"

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          echo "auth_methods: $auth_methods"
          if [[ ${auth_methods} -gt 1 ]]; then
            echo "PASS: correctly detected multiple auth methods (would warn)"
          else
            echo "FAIL: expected to detect multiple auth methods"
            exit 1
          fi
