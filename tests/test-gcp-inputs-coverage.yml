name: Test GCP inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-key-for-coverage'
          gcp_location: 'us-central1'
          gcp_project_id: 'my-fake-project'
          gcp_service_account: 'fake-sa@my-fake-project.iam.gserviceaccount.com'
          gcp_workload_identity_provider: 'projects/123/locations/global/workloadIdentityPools/pool/providers/provider'
          prompt: 'Say hello'
      - name: Assert action ran (validation step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at auth/run step with fake credentials,
          # but the validate_inputs step should have run and warned about multiple auth methods.
          # We just verify the step ran (outcome is either success or failure, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
