name: Test gemini-cli version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action installs a specific version of gemini-cli
      # and that the CLI is available after installation.
      # We use continue-on-error because the fake API key will cause the
      # gemini run step to fail, but we only care that installation succeeded.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          gemini_cli_version: 'latest'
          prompt: 'Say hello'

      - name: Assert gemini CLI is installed and on PATH
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if ! command -v gemini > /dev/null 2>&1; then
            echo "FAIL: gemini CLI not found in PATH after action ran"
            exit 1
          fi
          echo "PASS: gemini CLI is installed"

      - name: Assert custom commands directory exists
        run: |
          if [ ! -d ".gemini/commands" ]; then
            echo "FAIL: .gemini/commands directory not found"
            exit 1
          fi
          COMMAND_COUNT=$(ls .gemini/commands/*.toml 2>/dev/null | wc -l)
          echo "Command files found: ${COMMAND_COUNT}"
          if [ "${COMMAND_COUNT}" -gt 0 ]; then
            echo "PASS: custom commands installed"
          else
            echo "FAIL: no .toml command files found in .gemini/commands"
            exit 1
          fi
