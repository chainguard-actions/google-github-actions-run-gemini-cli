name: Test action without settings input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clean up any existing .gemini directory
        run: rm -rf .gemini/

      # Test that when settings is not provided, .gemini/settings.json is NOT
      # created (the Configure Gemini CLI step has an 'if' condition).
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-key-for-no-settings-test'
          # Intentionally NOT providing 'settings' input

      - name: Assert .gemini/settings.json was NOT created
        run: |
          echo "Checking that .gemini/settings.json was NOT created..."
          if [ -f ".gemini/settings.json" ]; then
            echo "FAIL: .gemini/settings.json was created but should not have been (no settings input)"
            cat .gemini/settings.json
            exit 1
          fi
          echo "PASS: .gemini/settings.json was correctly not created when settings input is empty"

      - name: Assert .gemini/commands directory was still populated
        run: |
          echo "Checking for .gemini/commands directory..."
          if [ ! -d ".gemini/commands" ]; then
            echo "FAIL: .gemini/commands directory was not created"
            exit 1
          fi
          echo "Contents of .gemini/commands:"
          ls -la .gemini/commands/
          FILE_COUNT=$(ls .gemini/commands/ | wc -l)
          echo "File count: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "FAIL: no command files were copied to .gemini/commands/"
            exit 1
          fi
          echo "PASS: .gemini/commands populated with $FILE_COUNT file(s) even without settings"

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran as expected"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
