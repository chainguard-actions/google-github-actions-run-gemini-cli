name: Test Vertex AI with google_api_key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: fake-vertex-api-key-for-testing
          gcp_project_id: my-fake-project-id
          gcp_location: us-central1
          use_vertex_ai: 'true'
          prompt: 'Say hello in one word.'
          gemini_cli_version: 'latest'
          workflow_name: 'test-vertex-ai-api-key'

      - name: Assert action ran (validate_inputs step always runs)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the Run Gemini CLI step with a fake key
          # but it should not fail at validate_inputs (which only warns)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
