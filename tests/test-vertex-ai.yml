name: Test Vertex AI with google_api_key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          google_api_key: 'fake-vertex-api-key-for-testing'
          use_vertex_ai: 'true'
          gcp_location: 'us-central1'
          gcp_project_id: 'my-test-project'
          prompt: 'Say hello'
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action was invoked with outcome=${{ steps.action.outcome }}"
