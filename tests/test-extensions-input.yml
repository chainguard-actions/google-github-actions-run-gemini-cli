name: Test extensions input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with extensions input
        id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-key-for-input-coverage'
          extensions: '["@google/gemini-cli-extension-example"]'
          prompt: 'Hello'

      - name: Assert action ran (will fail without real API key, which is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no real Gemini API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
