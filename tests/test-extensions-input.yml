name: Test extensions input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-input-coverage'
          extensions: '[]'
          prompt: 'Say hello'
      - name: Assert action ran (install succeeded, run failed gracefully with fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key not valid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
