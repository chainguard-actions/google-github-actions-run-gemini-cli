name: Test extensions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the extensions input is accepted by the action.
      # We pass an empty JSON array so no actual extension installation is attempted,
      # but the input is exercised. The action will fail at the run step with a fake API key.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          extensions: '[]'

      - name: Assert action failed at run step (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected with fake API key (extensions input was accepted)"

      - name: Assert gemini CLI was installed (install step ran before run step failed)
        run: |
          # Verify gemini CLI was installed successfully before the run step failed
          if command -v gemini > /dev/null 2>&1; then
            echo "PASS: gemini CLI is installed"
            gemini --version || echo "version command not available"
          else
            echo "INFO: gemini CLI not found in PATH (may have been cleaned up)"
          fi
          echo "PASS: extensions input was accepted by the action"
