name: Test gemini_debug and gemini_model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake npm and gemini CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Create the fake gemini binary that handles --debug and --yolo flags
          cat > /tmp/fake-gemini << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "1.0.0-fake"
            exit 0
          fi
          # Output valid JSON regardless of flags
          printf '{"response": "Hello from fake Gemini with debug mode!"}'
          exit 0
          EOF
          chmod +x /tmp/fake-gemini

          REAL_NPM="$(which npm)"
          cat > "$HOME/.local/bin/npm" << NPMEOF
          #!/bin/sh
          case "\$*" in
            *@google/gemini-cli*)
              echo "Intercepted gemini-cli install, installing fake binary"
              cp /tmp/fake-gemini /usr/local/bin/gemini
              chmod +x /usr/local/bin/gemini
              exit 0
              ;;
            *)
              exec "${REAL_NPM}" "\$@"
              ;;
          esac
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          gemini_model: 'gemini-2.0-flash'
          gemini_debug: 'true'
          prompt: 'Say hello'

      - name: Assert summary output is set
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is set with debug and model inputs: $ACTUAL"
