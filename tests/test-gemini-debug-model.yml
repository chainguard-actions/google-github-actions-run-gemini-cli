name: Test gemini_debug and gemini_model inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises the gemini_debug and gemini_model inputs.
      # The action will fail at the CLI run step because the API key is fake,
      # but the inputs are passed and the install step will succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-debug-model-test'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'
          prompt: 'Say hello in one word'
          gemini_cli_version: 'latest'

      - name: Assert action ran with debug and model inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With a fake API key, the action should fail at the CLI run step.
          # We just verify the action was invoked and ran (not skipped).
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action step did not run at all"
            exit 1
          fi
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key, as expected)"
          elif [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action succeeded (real API key available?)"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
