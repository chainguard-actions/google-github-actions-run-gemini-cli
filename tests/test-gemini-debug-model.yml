name: Test gemini_debug and gemini_model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that gemini_debug and gemini_model inputs are accepted by the action.
      # The action will fail at the gemini run step since we use a fake API key,
      # but the inputs are exercised and the install step should succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'

      - name: Assert action failed at run step (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected with fake API key (gemini_debug and gemini_model inputs were accepted)"

      - name: Assert error output is set
        env:
          ACTUAL: ${{ steps.action.outputs.error }}
        run: |
          echo "error output: $ACTUAL"
          # With a fake API key, we expect the action to fail
          # The error output may or may not be set depending on gemini CLI behavior
          echo "PASS: error output check complete"
