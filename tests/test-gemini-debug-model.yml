name: Test gemini_debug and gemini_model inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with gemini_debug and gemini_model inputs.
      # The action will fail at the gemini_run step due to the fake API key,
      # but the inputs are exercised and the install step should succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the gemini_run step with a fake API key.
          # Both 'success' and 'failure' are acceptable; 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (gemini_debug and gemini_model inputs accepted)"
