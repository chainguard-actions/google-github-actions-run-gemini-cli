name: Test Gemini Debug and Model Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-input-coverage'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'
          prompt: 'Say hello'

      - name: Assert action ran with debug and model inputs (fails gracefully without real API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          echo "error: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with debug and model inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Gemini API key available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
