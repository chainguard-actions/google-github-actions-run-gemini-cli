name: Test gemini_debug and gemini_model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test covers gemini_debug and gemini_model inputs.
      # The action will fail at the run step since the API key is fake,
      # but the inputs will be accepted and processed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'

      - name: Assert action failed at run step (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected with fake API key (gemini_debug and gemini_model inputs were accepted)"

      - name: Assert gemini CLI was installed (debug/model inputs don't affect install)
        run: |
          if ! command -v gemini > /dev/null 2>&1; then
            echo "FAIL: gemini CLI was not installed"
            exit 1
          fi
          echo "PASS: gemini CLI is installed"
          gemini --version || echo "(version command not available)"
