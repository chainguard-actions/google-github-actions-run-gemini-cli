name: Test gemini_debug and gemini_model inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with gemini_debug and gemini_model inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-coverage'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'
          prompt: 'Hello'

      - name: Assert action was attempted with debug and model inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail at the gemini_run step due to fake API key,
          # but the inputs are exercised. We just verify the step was attempted.
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action step did not run"
            exit 1
          fi
          echo "PASS: action step ran with gemini_debug and gemini_model inputs (outcome: ${{ steps.action.outcome }})"
