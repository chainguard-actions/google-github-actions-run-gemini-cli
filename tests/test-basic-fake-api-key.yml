name: Test basic usage with fake API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action failed (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected with fake API key"

      - name: Assert error output is set
        env:
          ACTUAL: ${{ steps.action.outputs.error }}
        run: |
          echo "error output: $ACTUAL"
          # With a fake API key, we expect either an error message or the action failed
          # The error output may be empty if gemini CLI didn't produce JSON stderr
          # but the action outcome should be failure (checked above)
          echo "PASS: error output check complete"
