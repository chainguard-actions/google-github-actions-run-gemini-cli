name: Test error output on failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-api-key-for-testing'

      - name: Assert action failed (expected with fake API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "WARN: expected failure with fake API key, got: ${{ steps.action.outcome }}"
          else
            echo "PASS: action failed as expected with fake API key"
          fi

      - name: Assert error output is set
        env:
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "error output: $ERROR_OUTPUT"
          # When the action fails, the error output should be populated
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            if [ -z "$ERROR_OUTPUT" ]; then
              echo "WARN: error output is empty on failure (may be set before exit)"
            else
              echo "PASS: error output is populated: $ERROR_OUTPUT"
            fi
          fi
          echo "PASS: error output check complete"

      - name: Assert summary output exists (may be empty on failure)
        env:
          SUMMARY_OUTPUT: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary output: $SUMMARY_OUTPUT"
          echo "PASS: summary output check complete"
