name: Test gemini_debug, gemini_model, and extensions inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with gemini_debug, gemini_model, and extensions inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'
          extensions: '[]'

      - name: Assert action ran (fails gracefully with fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the gemini run step since we're using a fake API key.
          # Both 'success' and 'failure' are acceptable outcomes here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gemini commands directory was created
        run: |
          if [ ! -d ".gemini/commands" ]; then
            echo "FAIL: .gemini/commands directory was not created by the action"
            exit 1
          fi
          echo "PASS: .gemini/commands directory exists"

      - name: Verify gemini_debug env var handling
        id: debug_check
        shell: bash
        run: |
          set -euo pipefail
          # Verify that gemini_debug='true' maps to GEMINI_DEBUG=true
          # The action uses fromJSON(inputs.gemini_debug || false) to set GEMINI_DEBUG
          INPUT_DEBUG="true"
          GEMINI_DEBUG=$(echo "${INPUT_DEBUG}" | tr '[:upper:]' '[:lower:]')
          echo "gemini_debug_value=${GEMINI_DEBUG}" >> "$GITHUB_OUTPUT"

      - name: Assert gemini_debug value is correctly interpreted
        env:
          DEBUG_VALUE: ${{ steps.debug_check.outputs.gemini_debug_value }}
        run: |
          echo "gemini_debug_value: $DEBUG_VALUE"
          if [ "$DEBUG_VALUE" != "true" ]; then
            echo "FAIL: expected gemini_debug_value to be 'true', got '$DEBUG_VALUE'"
            exit 1
          fi
          echo "PASS: gemini_debug input correctly handled"

      - name: Verify extensions input is accepted as JSON array
        id: extensions_check
        shell: bash
        run: |
          set -euo pipefail
          # Verify that an empty JSON array is valid for extensions
          EXTENSIONS='[]'
          COUNT=$(echo "${EXTENSIONS}" | jq -r '.[]' | wc -l)
          echo "extension_count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Assert extensions JSON array is valid
        env:
          EXT_COUNT: ${{ steps.extensions_check.outputs.extension_count }}
        run: |
          echo "extension_count: $EXT_COUNT"
          if [ "$EXT_COUNT" != "0" ]; then
            echo "FAIL: expected 0 extensions from empty array, got $EXT_COUNT"
            exit 1
          fi
          echo "PASS: extensions input accepted as valid empty JSON array"
