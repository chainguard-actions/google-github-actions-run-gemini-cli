name: Test GCP inputs are accepted (validation path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake npm and gemini CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Create the fake gemini binary
          cat > /tmp/fake-gemini << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "1.0.0-fake"
            exit 0
          fi
          printf '{"response": "Hello from fake Gemini!"}'
          exit 0
          EOF
          chmod +x /tmp/fake-gemini

          REAL_NPM="$(which npm)"
          cat > "$HOME/.local/bin/npm" << NPMEOF
          #!/bin/sh
          case "\$*" in
            *@google/gemini-cli*)
              echo "Intercepted gemini-cli install, installing fake binary"
              cp /tmp/fake-gemini /usr/local/bin/gemini
              chmod +x /usr/local/bin/gemini
              exit 0
              ;;
            *)
              exec "${REAL_NPM}" "\$@"
              ;;
          esac
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run action with GCP inputs (validation warns, auth step skipped with fake provider)
        id: action
        uses: .
        continue-on-error: true
        with:
          gcp_location: 'us-central1'
          gcp_project_id: 'my-fake-project'
          gcp_service_account: 'fake-sa@my-fake-project.iam.gserviceaccount.com'
          gcp_workload_identity_provider: 'projects/123/locations/global/workloadIdentityPools/pool/providers/provider'
          use_vertex_ai: 'true'
          prompt: 'Hello world'

      - name: Assert action ran (may fail at auth step, that is expected)
        run: |
          echo "PASS: action step was invoked with GCP inputs"
          echo "The action validates GCP inputs and may fail at auth with fake credentials"
          echo "This test verifies the inputs are accepted by the action interface"
