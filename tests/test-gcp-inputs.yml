name: Test GCP location, project_id, and service_account inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with GCP-related inputs. The action will fail at the
      # auth step because the WIF provider is fake, but the inputs are exercised.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456/locations/global/workloadIdentityPools/test-pool/providers/test-provider'
          gcp_project_id: 'my-test-project'
          gcp_location: 'us-central1'
          gcp_service_account: 'test-sa@my-test-project.iam.gserviceaccount.com'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the auth step with fake WIF credentials.
          # Both 'success' and 'failure' are acceptable; 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Verify gcp_location, gcp_project_id, gcp_service_account inputs are accepted
        run: |
          echo "PASS: gcp_location, gcp_project_id, and gcp_service_account inputs were accepted by the action"
