name: Test GCP location, project_id, and service_account inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with GCP inputs (WIF scenario)
        id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456/locations/global/workloadIdentityPools/test-pool/providers/test-provider'
          gcp_project_id: 'my-test-project'
          gcp_location: 'us-central1'
          gcp_service_account: 'test-sa@my-test-project.iam.gserviceaccount.com'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (fails gracefully without real WIF credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the GCP auth step since we don't have real WIF credentials.
          # Both 'success' and 'failure' are acceptable outcomes here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify gcp_project_id and gcp_location are passed through validation
        id: validate_gcp
        shell: bash
        run: |
          set -euo pipefail

          # Simulate the validate_inputs logic for WIF with project_id and service_account
          WARNINGS=""

          warn() {
            local msg="$1"
            echo "WARNING: ${msg}" >&2
            WARNINGS="${WARNINGS}${msg}|"
          }

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          # With WIF + project_id + service_account + use_vertex_ai=true, no warnings expected
          MISSING_PROJECT_ID="false"
          MISSING_SA="false"
          MISSING_VERTEX_OR_GCA="false"

          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then
            if [[ "${INPUT_GCP_PROJECT_ID_PRESENT:-false}" != "true" ]]; then
              MISSING_PROJECT_ID="true"
              warn "Missing gcp_project_id"
            fi
            if [[ "${INPUT_GCP_TOKEN_FORMAT}" != "" && "${INPUT_GCP_SERVICE_ACCOUNT_PRESENT:-false}" != "true" ]]; then
              MISSING_SA="true"
              warn "Missing gcp_service_account"
            fi
            if [[ "${INPUT_USE_VERTEX_AI:-false}" == "${INPUT_USE_GEMINI_CODE_ASSIST:-false}" ]]; then
              MISSING_VERTEX_OR_GCA="true"
              warn "Must set exactly one of use_vertex_ai or use_gemini_code_assist"
            fi
          fi

          echo "auth_methods=${auth_methods}" >> "$GITHUB_OUTPUT"
          echo "missing_project_id=${MISSING_PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "missing_sa=${MISSING_SA}" >> "$GITHUB_OUTPUT"
          echo "missing_vertex_or_gca=${MISSING_VERTEX_OR_GCA}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_GEMINI_API_KEY_PRESENT: "false"
          INPUT_GOOGLE_API_KEY_PRESENT: "false"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT: "true"
          INPUT_GCP_PROJECT_ID_PRESENT: "true"
          INPUT_GCP_SERVICE_ACCOUNT_PRESENT: "true"
          INPUT_GCP_TOKEN_FORMAT: "access_token"
          INPUT_USE_VERTEX_AI: "true"
          INPUT_USE_GEMINI_CODE_ASSIST: "false"

      - name: Assert no validation warnings for complete WIF inputs
        env:
          MISSING_PROJECT_ID: ${{ steps.validate_gcp.outputs.missing_project_id }}
          MISSING_SA: ${{ steps.validate_gcp.outputs.missing_sa }}
          MISSING_VERTEX_OR_GCA: ${{ steps.validate_gcp.outputs.missing_vertex_or_gca }}
          AUTH_METHODS: ${{ steps.validate_gcp.outputs.auth_methods }}
        run: |
          echo "auth_methods: $AUTH_METHODS"
          echo "missing_project_id: $MISSING_PROJECT_ID"
          echo "missing_sa: $MISSING_SA"
          echo "missing_vertex_or_gca: $MISSING_VERTEX_OR_GCA"

          if [ "$AUTH_METHODS" != "1" ]; then
            echo "FAIL: expected exactly 1 auth method, got $AUTH_METHODS"
            exit 1
          fi
          if [ "$MISSING_PROJECT_ID" != "false" ]; then
            echo "FAIL: expected no missing_project_id warning"
            exit 1
          fi
          if [ "$MISSING_SA" != "false" ]; then
            echo "FAIL: expected no missing_sa warning"
            exit 1
          fi
          if [ "$MISSING_VERTEX_OR_GCA" != "false" ]; then
            echo "FAIL: expected no missing_vertex_or_gca warning"
            exit 1
          fi
          echo "PASS: all GCP inputs validated correctly with no warnings"
