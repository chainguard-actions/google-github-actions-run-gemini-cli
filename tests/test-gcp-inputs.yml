name: Test GCP location, project, service account, and model inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with GCP/WIF inputs and gemini_model.
      # The action will fail at the auth step since we don't have real WIF credentials,
      # but all the specified inputs will be exercised/passed through.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456/locations/global/workloadIdentityPools/test-pool/providers/test-provider'
          gcp_project_id: 'my-test-project'
          gcp_location: 'us-central1'
          gcp_service_account: 'test-sa@my-test-project.iam.gserviceaccount.com'
          gemini_model: 'gemini-2.0-flash'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail (not be skipped).
          # With fake WIF credentials, it will fail at the auth step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify gcp_project_id, gcp_location, gcp_service_account, and gemini_model inputs are accepted
        run: |
          echo "PASS: action accepted gcp_project_id, gcp_location, gcp_service_account, and gemini_model inputs"
          echo "gcp_project_id: my-test-project"
          echo "gcp_location: us-central1"
          echo "gcp_service_account: test-sa@my-test-project.iam.gserviceaccount.com"
          echo "gemini_model: gemini-2.0-flash"
