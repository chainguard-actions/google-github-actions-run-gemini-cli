name: Test GCP inputs coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises the GCP-related inputs. The action will fail at the
      # 'Authenticate to Google Cloud' step because the WIF provider is fake,
      # but the inputs are passed and the validate_inputs step will run first.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/fake-pool/providers/fake-provider'
          gcp_project_id: 'fake-project-id'
          gcp_service_account: 'fake-sa@fake-project-id.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          prompt: 'Say hello'

      - name: Assert action ran (GCP inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the WIF provider is fake,
          # but it must have run (not been skipped).
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action step did not run at all"
            exit 1
          fi
          # Accept either failure (expected: fake WIF) or success
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed gracefully (fake WIF provider cannot authenticate)"
          elif [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real auth available?)"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
