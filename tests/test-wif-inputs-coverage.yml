name: Test WIF and GCP inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          gcp_project_id: 'my-fake-project'
          gcp_service_account: 'my-sa@my-fake-project.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
      - name: Assert action ran (WIF and GCP inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          echo "error: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real WIF credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
