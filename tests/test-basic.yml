name: Test basic usage with gemini_api_key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          settings: '{"theme": "dark"}'
          gemini_model: 'gemini-2.0-flash'
          gemini_debug: 'false'
      - name: Assert action ran (validate_inputs step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the Run Gemini CLI step due to invalid credentials
          # but the validate_inputs and install steps should have run
          # We just verify the action was invoked (outcome is set)
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action was invoked with outcome=${{ steps.action.outcome }}"
