name: Test workflow name sanitization
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with special-char workflow name
        id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          workflow_name: 'My Workflow! @#$%^&*()'

      - name: Assert action ran (sanitization step should not fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (sanitize step succeeds) and fail only at CLI execution
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Test sanitize workflow name logic - special chars
        id: sanitize_special
        shell: bash
        run: |
          WORKFLOW_NAME="My Workflow! @#\$%^&*()"
          SANITIZED=$(echo "${WORKFLOW_NAME}" | sed 's/[^ a-zA-Z0-9-]//g' | xargs | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          echo "sanitized: $SANITIZED"
          echo "gh_workflow_name=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Assert sanitized name for special chars
        env:
          ACTUAL: ${{ steps.sanitize_special.outputs.gh_workflow_name }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="my_workflow"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Test sanitize workflow name logic - normal name
        id: sanitize_normal
        shell: bash
        run: |
          WORKFLOW_NAME="CI Build Pipeline"
          SANITIZED=$(echo "${WORKFLOW_NAME}" | sed 's/[^ a-zA-Z0-9-]//g' | xargs | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          echo "gh_workflow_name=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Assert sanitized name for normal name
        env:
          ACTUAL: ${{ steps.sanitize_normal.outputs.gh_workflow_name }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="ci_build_pipeline"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Test sanitize workflow name logic - already clean
        id: sanitize_clean
        shell: bash
        run: |
          WORKFLOW_NAME="test-workflow-123"
          SANITIZED=$(echo "${WORKFLOW_NAME}" | sed 's/[^ a-zA-Z0-9-]//g' | xargs | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          echo "gh_workflow_name=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Assert sanitized name for already clean name
        env:
          ACTUAL: ${{ steps.sanitize_clean.outputs.gh_workflow_name }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="test-workflow-123"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
