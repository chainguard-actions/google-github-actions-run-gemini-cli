name: Test workflow name sanitization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with a workflow name containing special characters.
      # The sanitize step runs before the gemini run step, so even with a fake
      # API key the sanitization logic will execute. We use continue-on-error
      # because the fake key causes the gemini run step to fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          workflow_name: 'CI/CD Pipeline! Test #1'

      - name: Assert action ran (sanitize step executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          OUTCOME="${{ steps.action.outcome }}"
          if [ "${OUTCOME}" = "success" ] || [ "${OUTCOME}" = "failure" ]; then
            echo "PASS: action ran (outcome: ${OUTCOME})"
          else
            echo "FAIL: unexpected outcome '${OUTCOME}'"
            exit 1
          fi

      # Verify the sanitization logic directly to ensure correctness
      - name: Verify sanitization logic
        run: |
          set -euo pipefail

          test_sanitize() {
            local input="$1"
            local expected="$2"
            local result
            result=$(echo "${input}" | sed 's/[^ a-zA-Z0-9-]//g' | xargs | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
            echo "Input:    '${input}'"
            echo "Expected: '${expected}'"
            echo "Got:      '${result}'"
            if [ "${result}" != "${expected}" ]; then
              echo "FAIL: sanitization mismatch"
              return 1
            fi
            echo "PASS"
            return 0
          }

          FAILED=false

          # Test 1: Normal workflow name with spaces
          test_sanitize "My Workflow Name" "my_workflow_name" || FAILED=true

          # Test 2: Workflow name with special characters
          test_sanitize "CI/CD Pipeline!" "cicd_pipeline" || FAILED=true

          # Test 3: Already lowercase with dashes
          test_sanitize "my-workflow" "my-workflow" || FAILED=true

          # Test 4: Mixed case with numbers
          test_sanitize "Build 123 Test" "build_123_test" || FAILED=true

          # Test 5: Empty-ish name (only special chars)
          test_sanitize "!!!" "" || FAILED=true

          if [ "${FAILED}" = "true" ]; then
            echo "FAIL: One or more sanitization tests failed"
            exit 1
          fi
          echo "All sanitization tests PASSED"
