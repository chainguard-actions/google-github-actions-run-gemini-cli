name: Test workflow name sanitization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action sanitizes the workflow name correctly.
      # The workflow_name input with special characters should be sanitized to
      # lowercase alphanumeric with underscores only.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          workflow_name: 'My Test Workflow! #123'

      - name: Assert action ran (validation and sanitization steps completed)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the gemini run step (fake API key),
          # but the sanitize step should have run successfully before that.
          # We verify the action at least started and got past validation.
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed at run step as expected (sanitization ran before that)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi

      - name: Verify sanitization logic independently
        run: |
          # Test the sanitization logic directly to verify it works as expected
          WORKFLOW_NAME='My Test Workflow! #123'
          SANITIZED=$(echo "${WORKFLOW_NAME}" | sed 's/[^ a-zA-Z0-9-]//g' | xargs | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          echo "input: $WORKFLOW_NAME"
          echo "sanitized: $SANITIZED"
          EXPECTED="my_test_workflow_123"
          if [ "$SANITIZED" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$SANITIZED'"
            exit 1
          fi
          echo "PASS: workflow name sanitized correctly to '$SANITIZED'"
