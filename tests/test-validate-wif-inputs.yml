name: Test input validation - WIF missing companion inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with WIF but missing project_id and service_account
        id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123/locations/global/workloadIdentityPools/pool/providers/provider'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (validate step warns but does not fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The validate_inputs step only emits warnings for missing WIF companion inputs.
          # The action will fail at the auth step (no real WIF credentials).
          # Both 'success' and 'failure' are acceptable outcomes.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify WIF validation warning logic inline
        id: validate_wif
        shell: bash
        run: |
          set -euo pipefail

          WARNINGS=""

          warn() {
            local msg="$1"
            echo "WARNING: ${msg}" >&2
            WARNINGS="${WARNINGS}${msg}|"
          }

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          if [[ ${auth_methods} -eq 0 ]]; then
            warn "No authentication method provided."
          fi

          if [[ ${auth_methods} -gt 1 ]]; then
            warn "Multiple authentication methods provided."
          fi

          # Validate Workload Identity Federation inputs
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then
            if [[ "${INPUT_GCP_PROJECT_ID_PRESENT:-false}" != "true" ]]; then
              warn "When using Workload Identity Federation ('gcp_workload_identity_provider'), you must also provide 'gcp_project_id'."
              echo "missing_project_id_warning=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "${INPUT_GCP_TOKEN_FORMAT}" != "" && "${INPUT_GCP_SERVICE_ACCOUNT_PRESENT:-false}" != "true" ]]; then
              warn "When using Workload Identity Federation with token generation ('gcp_token_format'), you must also provide 'gcp_service_account'."
              echo "missing_service_account_warning=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "${INPUT_USE_VERTEX_AI:-false}" == "${INPUT_USE_GEMINI_CODE_ASSIST:-false}" ]]; then
              warn "When using Workload Identity Federation, you must set exactly one of 'use_vertex_ai' or 'use_gemini_code_assist' to 'true'."
              echo "missing_vertex_or_gca_warning=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "auth_methods=${auth_methods}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_GEMINI_API_KEY_PRESENT: "false"
          INPUT_GOOGLE_API_KEY_PRESENT: "false"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT: "true"
          INPUT_GCP_PROJECT_ID_PRESENT: "false"
          INPUT_GCP_SERVICE_ACCOUNT_PRESENT: "false"
          INPUT_GCP_TOKEN_FORMAT: "access_token"
          INPUT_USE_VERTEX_AI: "false"
          INPUT_USE_GEMINI_CODE_ASSIST: "false"

      - name: Assert WIF validation warnings were triggered
        env:
          MISSING_PROJECT_ID: ${{ steps.validate_wif.outputs.missing_project_id_warning }}
          MISSING_SA: ${{ steps.validate_wif.outputs.missing_service_account_warning }}
          MISSING_VERTEX_OR_GCA: ${{ steps.validate_wif.outputs.missing_vertex_or_gca_warning }}
        run: |
          echo "missing_project_id_warning: $MISSING_PROJECT_ID"
          echo "missing_service_account_warning: $MISSING_SA"
          echo "missing_vertex_or_gca_warning: $MISSING_VERTEX_OR_GCA"

          if [ "$MISSING_PROJECT_ID" != "true" ]; then
            echo "FAIL: expected missing_project_id_warning to be 'true'"
            exit 1
          fi
          if [ "$MISSING_SA" != "true" ]; then
            echo "FAIL: expected missing_service_account_warning to be 'true'"
            exit 1
          fi
          if [ "$MISSING_VERTEX_OR_GCA" != "true" ]; then
            echo "FAIL: expected missing_vertex_or_gca_warning to be 'true'"
            exit 1
          fi
          echo "PASS: all expected WIF validation warnings were triggered"
