name: Test GCP Workload Identity Federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          gcp_project_id: 'my-test-project'
          gcp_service_account: 'my-sa@my-test-project.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          prompt: 'Say hello'

      - name: Assert action ran with GCP inputs (expected to fail without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because we don't have real GCP credentials,
          # but it should fail at the auth step, not before (meaning inputs were accepted)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without real GCP credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
