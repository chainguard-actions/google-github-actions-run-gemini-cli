name: Test GCP Workload Identity Federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/test-pool/providers/test-provider'
          gcp_project_id: 'test-project-id'
          gcp_service_account: 'test-sa@test-project-id.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          prompt: 'Say hello'

      - name: Assert action ran (GCP auth fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake GCP credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
