name: Test GCP Workload Identity Federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that gcp_workload_identity_provider, gcp_project_id, gcp_service_account,
      # and gcp_location inputs are accepted by the action. The action will fail at the
      # GCP auth step since we don't have real credentials, but the inputs are exercised.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcp_workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/fake-pool/providers/fake-provider'
          gcp_project_id: 'fake-project-id'
          gcp_service_account: 'fake-sa@fake-project-id.iam.gserviceaccount.com'
          gcp_location: 'us-central1'
          use_vertex_ai: 'true'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (failed gracefully on fake GCP credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the GCP credentials are fake
          # (the auth step will fail with invalid workload identity provider)
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail with fake GCP credentials"
            exit 1
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed as expected with fake GCP credentials"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi

      - name: Verify GCP input validation logic
        run: |
          # Simulate the validation logic for WIF inputs
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT="true"
          INPUT_GCP_PROJECT_ID_PRESENT="true"
          INPUT_GCP_SERVICE_ACCOUNT_PRESENT="true"
          INPUT_GCP_TOKEN_FORMAT="access_token"
          INPUT_USE_VERTEX_AI="true"
          INPUT_USE_GEMINI_CODE_ASSIST="false"

          auth_methods=0
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          echo "auth_methods: $auth_methods"
          if [ "$auth_methods" -ne 1 ]; then
            echo "FAIL: expected 1 auth method (WIF), got $auth_methods"
            exit 1
          fi

          # Verify project_id is present (required for WIF)
          if [[ "${INPUT_GCP_PROJECT_ID_PRESENT}" != "true" ]]; then
            echo "FAIL: gcp_project_id should be present"
            exit 1
          fi

          # Verify service account is present (required when token_format is set)
          if [[ "${INPUT_GCP_TOKEN_FORMAT}" != "" && "${INPUT_GCP_SERVICE_ACCOUNT_PRESENT}" != "true" ]]; then
            echo "FAIL: gcp_service_account should be present when token_format is set"
            exit 1
          fi

          echo "PASS: WIF validation logic works correctly"
