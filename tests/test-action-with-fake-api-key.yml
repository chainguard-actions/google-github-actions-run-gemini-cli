name: Test action invocation with fake API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with a fake API key.
      # The action will:
      # 1. Pass validate_inputs (warns about nothing since gemini_api_key is set)
      # 2. Sanitize workflow name
      # 3. Skip settings config (no settings input)
      # 4. Install custom commands
      # 5. Skip GCP auth (no WIF provider)
      # 6. Install gemini-cli (real npm install)
      # 7. Fail at Run Gemini CLI (fake API key)
      # We use continue-on-error to capture what we can.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          workflow_name: 'Test Workflow!'

      - name: Assert action ran (even if it failed at the run step)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail at the gemini run step
          # (not at validate/sanitize/install steps)
          # We accept both 'success' and 'failure' outcomes here
          OUTCOME="${{ steps.action.outcome }}"
          if [ "${OUTCOME}" = "success" ] || [ "${OUTCOME}" = "failure" ]; then
            echo "PASS: action ran to completion (outcome: ${OUTCOME})"
          else
            echo "FAIL: unexpected outcome '${OUTCOME}'"
            exit 1
          fi

      - name: Assert custom commands were installed
        run: |
          # The Install Custom Commands step should have run before any failure
          if [ -d ".gemini/commands" ]; then
            COMMAND_COUNT=$(ls .gemini/commands/*.toml 2>/dev/null | wc -l)
            echo "Command files found: ${COMMAND_COUNT}"
            if [ "${COMMAND_COUNT}" -gt 0 ]; then
              echo "PASS: custom commands were installed"
            else
              echo "FAIL: .gemini/commands exists but no .toml files found"
              exit 1
            fi
          else
            echo "FAIL: .gemini/commands directory not found"
            exit 1
          fi
