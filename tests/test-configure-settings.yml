name: Test configure Gemini CLI settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-api-key-for-testing'
          settings: '{"theme": "dark", "model": "gemini-pro"}'

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"

      - name: Assert settings file was created
        run: |
          if [ -f ".gemini/settings.json" ]; then
            echo "PASS: .gemini/settings.json exists"
            cat .gemini/settings.json
            # Verify the content is valid JSON with expected fields
            THEME=$(jq -r '.theme' .gemini/settings.json)
            echo "theme: $THEME"
            if [ "$THEME" != "dark" ]; then
              echo "FAIL: expected theme 'dark', got '$THEME'"
              exit 1
            fi
            echo "PASS: settings.json has correct content"
          else
            echo "FAIL: .gemini/settings.json was not created"
            exit 1
          fi
