name: Test settings configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with a settings JSON input.
      # The action writes settings to .gemini/settings.json before running gemini.
      # We use continue-on-error because the fake API key causes the gemini run
      # step to fail, but the settings file will have been created already.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Say hello'
          settings: '{"theme":"dark","model":"gemini-2.0-flash"}'

      - name: Assert action ran (settings step executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          OUTCOME="${{ steps.action.outcome }}"
          if [ "${OUTCOME}" = "success" ] || [ "${OUTCOME}" = "failure" ]; then
            echo "PASS: action ran (outcome: ${OUTCOME})"
          else
            echo "FAIL: unexpected outcome '${OUTCOME}'"
            exit 1
          fi

      - name: Assert settings file was created
        run: |
          set -euo pipefail

          if [ ! -f ".gemini/settings.json" ]; then
            echo "FAIL: .gemini/settings.json was not created"
            exit 1
          fi

          echo "settings.json content:"
          cat .gemini/settings.json

          # Verify it's valid JSON
          if ! jq -e . ".gemini/settings.json" > /dev/null 2>&1; then
            echo "FAIL: settings.json is not valid JSON"
            exit 1
          fi

          # Verify specific fields
          THEME=$(jq -r '.theme' ".gemini/settings.json")
          echo "theme: ${THEME}"
          if [ "${THEME}" != "dark" ]; then
            echo "FAIL: expected theme 'dark', got '${THEME}'"
            exit 1
          fi

          MODEL=$(jq -r '.model' ".gemini/settings.json")
          echo "model: ${MODEL}"
          if [ "${MODEL}" != "gemini-2.0-flash" ]; then
            echo "FAIL: expected model 'gemini-2.0-flash', got '${MODEL}'"
            exit 1
          fi

          echo "PASS: settings.json created with correct content"

      - name: Assert custom commands were installed
        run: |
          if [ ! -d ".gemini/commands" ]; then
            echo "FAIL: .gemini/commands directory not found"
            exit 1
          fi
          COMMAND_COUNT=$(ls .gemini/commands/*.toml 2>/dev/null | wc -l)
          echo "Command files found: ${COMMAND_COUNT}"
          if [ "${COMMAND_COUNT}" -gt 0 ]; then
            echo "PASS: custom commands installed"
          else
            echo "FAIL: no .toml command files found in .gemini/commands"
            exit 1
          fi
