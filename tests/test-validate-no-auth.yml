name: Test validation warning when no auth provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should emit a warning (not fail) during validate_inputs
      # when no authentication method is provided.
      # It will eventually fail at the gemini run step, which is expected.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_cli_version: 'latest'
          # No gemini_api_key, google_api_key, or gcp_workload_identity_provider

      - name: Assert action failed at run step (not at validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail (at the gemini run step, not at validation)
          # because no auth method means gemini CLI will fail
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without auth, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected (validation only warns, run step fails)"
