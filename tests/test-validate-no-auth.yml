name: Test input validation - no auth method
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no auth method provided
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (validate step warns but does not fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The validate_inputs step only emits warnings for missing auth,
          # so the action should proceed past validation and fail at CLI execution.
          # Both 'success' and 'failure' are acceptable outcomes.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify no-auth warning logic inline
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          warn() {
            local msg="$1"
            echo "WARNING: ${msg}" >&2
            echo "::warning title=Input validation::${msg}"
          }

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          if [[ ${auth_methods} -eq 0 ]]; then
            warn "No authentication method provided. Please provide one of 'gemini_api_key', 'google_api_key', or 'gcp_workload_identity_provider'."
            echo "no_auth_warning=true" >> "$GITHUB_OUTPUT"
          fi

          echo "auth_methods=${auth_methods}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_GEMINI_API_KEY_PRESENT: "false"
          INPUT_GOOGLE_API_KEY_PRESENT: "false"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT: "false"
          INPUT_GCP_PROJECT_ID_PRESENT: "false"
          INPUT_GCP_SERVICE_ACCOUNT_PRESENT: "false"
          INPUT_GCP_TOKEN_FORMAT: "access_token"
          INPUT_USE_VERTEX_AI: "false"
          INPUT_USE_GEMINI_CODE_ASSIST: "false"

      - name: Assert no-auth warning was triggered
        env:
          NO_AUTH_WARNING: ${{ steps.validate.outputs.no_auth_warning }}
          AUTH_METHODS: ${{ steps.validate.outputs.auth_methods }}
        run: |
          echo "no_auth_warning: $NO_AUTH_WARNING"
          echo "auth_methods: $AUTH_METHODS"
          if [ "$NO_AUTH_WARNING" != "true" ]; then
            echo "FAIL: expected no_auth_warning to be 'true'"
            exit 1
          fi
          if [ "$AUTH_METHODS" != "0" ]; then
            echo "FAIL: expected auth_methods to be '0', got '$AUTH_METHODS'"
            exit 1
          fi
          echo "PASS"
