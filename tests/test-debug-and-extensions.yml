name: Test gemini_debug and extensions inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with gemini_debug and extensions inputs.
      # The action will fail at the gemini_run step due to the fake API key,
      # but the gemini_debug and extensions inputs will be exercised.
      # extensions is a JSON array of extension names.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          gemini_debug: 'true'
          extensions: '[]'
          prompt: 'Say hello'
          gemini_cli_version: 'latest'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail (not be skipped).
          # With a fake API key, it will fail at the gemini_run step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify gemini_debug and extensions inputs are accepted
        run: |
          echo "PASS: action accepted gemini_debug and extensions inputs"
          echo "gemini_debug: true"
          echo "extensions: []"
