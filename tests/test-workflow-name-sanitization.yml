name: Test workflow name sanitization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake npm and gemini CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          cat > /tmp/fake-gemini << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "1.0.0-fake"
            exit 0
          fi
          printf '{"response": "Sanitization test response"}'
          exit 0
          EOF
          chmod +x /tmp/fake-gemini

          REAL_NPM="$(which npm)"
          cat > "$HOME/.local/bin/npm" << NPMEOF
          #!/bin/sh
          case "\$*" in
            *@google/gemini-cli*)
              echo "Intercepted gemini-cli install, installing fake binary"
              cp /tmp/fake-gemini /usr/local/bin/gemini
              chmod +x /usr/local/bin/gemini
              exit 0
              ;;
            *)
              exec "${REAL_NPM}" "\$@"
              ;;
          esac
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run action with special characters in workflow name
        id: action
        uses: .
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'Hello'
          workflow_name: 'My Workflow! With Special@Chars#2024'

      - name: Assert action completed with sanitized workflow name
        run: |
          echo "PASS: action completed with special characters in workflow name"
          echo "The sanitize_workflow_name step should have cleaned the name to: my_workflow_with_specialchars2024"

      - name: Assert summary output is set
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is set"
