name: Test workflow name sanitization
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the sanitize_workflow_name step handles special characters.
      # The action will fail at gemini_run (no real API key), but we can verify
      # the sanitization step ran correctly by checking the action progressed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-key-for-sanitization-test'
          workflow_name: 'My Workflow! With @Special #Characters & Symbols'

      - name: Assert action progressed past sanitization step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at gemini_run (fake API key), not at
          # sanitize_workflow_name. Either outcome is acceptable here.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: sanitize_workflow_name step did not crash the action"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Verify sanitization logic independently
        run: |
          WORKFLOW_NAME='My Workflow! With @Special #Characters & Symbols'
          SANITIZED=$(echo "${WORKFLOW_NAME}" | sed 's/[^ a-zA-Z0-9-]//g' | xargs | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          echo "sanitized: $SANITIZED"
          EXPECTED="my_workflow_with_special_characters_symbols"
          if [ "$SANITIZED" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$SANITIZED'"
            exit 1
          fi
          echo "PASS: workflow name sanitized correctly"
