name: Test Gemini CLI installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a fake API key.
      # The "Install Gemini CLI" step should install @google/gemini-cli from npm.
      # The action will fail at the "Run Gemini CLI" step (fake credentials),
      # so we use continue-on-error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'
          gemini_api_key: 'fake-api-key-for-testing'
          gemini_cli_version: 'latest'

      # Verify that the gemini CLI was installed
      - name: Assert gemini CLI is installed
        run: |
          echo "Checking for gemini CLI in PATH..."
          if ! command -v gemini > /dev/null 2>&1; then
            echo "FAIL: gemini CLI not found in PATH after action ran"
            exit 1
          fi
          echo "gemini CLI found at: $(which gemini)"
          echo "PASS: gemini CLI was successfully installed"

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed at run step as expected with fake credentials"
