name: Test input validation - no auth method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with no authentication method.
      # The validate_inputs step emits a warning but does NOT exit non-zero,
      # so the action proceeds. It will fail at the gemini run step (no API key).
      # We use continue-on-error to capture the outcome.
      - id: action_no_auth
        uses: .
        continue-on-error: true
        with:
          prompt: 'Say hello'

      - name: Assert action ran (validate step did not crash it)
        run: |
          echo "Action outcome: ${{ steps.action_no_auth.outcome }}"
          OUTCOME="${{ steps.action_no_auth.outcome }}"
          # The action should fail (at gemini run step, not at validate step)
          # but it should not be 'cancelled' or 'skipped'
          if [ "${OUTCOME}" = "success" ] || [ "${OUTCOME}" = "failure" ]; then
            echo "PASS: action ran (outcome: ${OUTCOME})"
          else
            echo "FAIL: unexpected outcome '${OUTCOME}'"
            exit 1
          fi

      # Verify the no-auth validation logic inline
      - name: Verify no auth method detection warns
        run: |
          set -euo pipefail

          WARNINGS=""
          warn() {
            local msg="$1"
            echo "WARNING: ${msg}" >&2
            WARNINGS="${WARNINGS}|${msg}"
          }

          INPUT_GEMINI_API_KEY_PRESENT="false"
          INPUT_GOOGLE_API_KEY_PRESENT="false"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT="false"

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          if [[ ${auth_methods} -eq 0 ]]; then
            warn "No authentication method provided. Please provide one of 'gemini_api_key', 'google_api_key', or 'gcp_workload_identity_provider'."
          fi

          echo "auth_methods=${auth_methods}"
          echo "WARNINGS=${WARNINGS}"

          if [ "${auth_methods}" -ne 0 ]; then
            echo "FAIL: expected 0 auth methods, got ${auth_methods}"
            exit 1
          fi

          if [[ "${WARNINGS}" != *"No authentication method provided"* ]]; then
            echo "FAIL: expected 'No authentication method provided' warning"
            exit 1
          fi

          echo "PASS: validation correctly warns about missing auth without failing"

      - name: Verify multiple auth methods detection warns
        run: |
          set -euo pipefail

          WARNINGS=""
          warn() {
            local msg="$1"
            echo "WARNING: ${msg}" >&2
            WARNINGS="${WARNINGS}|${msg}"
          }

          INPUT_GEMINI_API_KEY_PRESENT="true"
          INPUT_GOOGLE_API_KEY_PRESENT="true"
          INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT="false"

          auth_methods=0
          if [[ "${INPUT_GEMINI_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GOOGLE_API_KEY_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi
          if [[ "${INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER_PRESENT:-false}" == "true" ]]; then ((++auth_methods)); fi

          if [[ ${auth_methods} -gt 1 ]]; then
            warn "Multiple authentication methods provided. Please use only one of 'gemini_api_key', 'google_api_key', or 'gcp_workload_identity_provider'."
          fi

          echo "auth_methods=${auth_methods}"
          echo "WARNINGS=${WARNINGS}"

          if [ "${auth_methods}" -ne 2 ]; then
            echo "FAIL: expected 2 auth methods, got ${auth_methods}"
            exit 1
          fi

          if [[ "${WARNINGS}" != *"Multiple authentication methods provided"* ]]; then
            echo "FAIL: expected 'Multiple authentication methods provided' warning"
            exit 1
          fi

          echo "PASS: validation correctly warns about multiple auth methods without failing"
