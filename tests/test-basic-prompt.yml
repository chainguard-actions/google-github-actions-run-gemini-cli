name: Test basic prompt with mocked gemini CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake npm and gemini CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Create the fake gemini binary
          cat > /tmp/fake-gemini << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "1.0.0-fake"
            exit 0
          fi
          # Output valid JSON to stdout for any prompt invocation
          printf '{"response": "Hello from fake Gemini! The answer is 42."}'
          exit 0
          EOF
          chmod +x /tmp/fake-gemini

          # Find the real npm path before we shadow it
          REAL_NPM="$(which npm)"
          echo "Real npm: $REAL_NPM"

          # Create a fake npm wrapper that intercepts gemini-cli installs
          cat > "$HOME/.local/bin/npm" << NPMEOF
          #!/bin/sh
          case "\$*" in
            *@google/gemini-cli*)
              echo "Intercepted gemini-cli install, installing fake binary"
              # Install fake gemini into /usr/local/bin (standard global npm bin)
              cp /tmp/fake-gemini /usr/local/bin/gemini
              chmod +x /usr/local/bin/gemini
              exit 0
              ;;
            *)
              exec "${REAL_NPM}" "\$@"
              ;;
          esac
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          gemini_api_key: 'fake-api-key-for-testing'
          prompt: 'What is 6 times 7?'

      - name: Assert summary output is set
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is set: $ACTUAL"

      - name: Assert error output is empty
        env:
          ACTUAL: ${{ steps.action.outputs.error }}
        run: |
          echo "actual: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected error output to be empty, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: error output is empty"
