name: Test with fake API key - install and graceful failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake API key
        id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-api-key-for-testing-12345'
          prompt: 'Say hello in one word'
          gemini_cli_version: 'latest'

      - name: Assert action failed (expected with fake API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With a fake API key, the action should fail at the CLI run step
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected with fake API key"

      - name: Assert error output is set
        env:
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "Error output: ${ERROR_OUTPUT}"
          # Error output should be non-empty when the CLI fails
          if [ -z "${ERROR_OUTPUT}" ]; then
            echo "WARNING: error output is empty (may be acceptable if CLI failed before producing output)"
          else
            echo "PASS: error output is set"
          fi
