name: Test gemini_debug and gemini_model inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gemini_api_key: 'fake-key-for-coverage'
          gemini_debug: 'true'
          gemini_model: 'gemini-2.0-flash'
          prompt: 'Say hello'
      - name: Assert action ran (not skipped)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the run step with a fake API key,
          # but it should not be skipped — validate_inputs and install steps should run.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
